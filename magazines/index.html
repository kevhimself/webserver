<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valley Magazine — All Issues</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700..900;1,9..144,700..900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--forest:#0D2218;--lime:#D8FF4F;--cream:#F5EDD6;--amber:#BF7F2E;--terra:#B85A42;--sage:#B8CEB5;--bark:#3A2518;}
html{font-size:18px}
body{font-family:'Inter',sans-serif;background:var(--forest);color:var(--cream);min-height:100vh}
.header{padding:clamp(3rem,6vw,7rem) clamp(2rem,7vw,9rem) 3rem;border-bottom:1px solid rgba(216,255,79,.15);}
.header-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1rem;}
.logo{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(3.5rem,10vw,9rem);line-height:.9;color:var(--cream);}
.logo .li{color:var(--lime);}
.tag{font-family:'Fraunces',serif;font-style:italic;font-size:clamp(1.1rem,2.5vw,1.8rem);color:var(--sage);margin-top:.6rem;}
.lbl{font-family:'Inter',sans-serif;font-weight:700;font-size:max(13px,.76rem);letter-spacing:.2em;text-transform:uppercase;opacity:.5;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:0;padding:clamp(2rem,5vw,5rem) clamp(2rem,7vw,9rem);}
.card{padding:2.5rem 2.5rem 2.5rem 0;border-bottom:1px solid rgba(245,237,214,.1);display:flex;flex-direction:column;gap:.6rem;text-decoration:none;transition:background .2s;}
.card:hover{background:rgba(216,255,79,.04);}
.card-season{font-family:'Inter',sans-serif;font-weight:700;font-size:max(13px,.76rem);letter-spacing:.2em;text-transform:uppercase;opacity:.45;}
.card-title{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(1.6rem,3vw,2.4rem);line-height:1;color:var(--cream);}
.card-date{font-family:'Inter',sans-serif;font-size:max(15px,.9rem);opacity:.45;}
.card-desc{font-family:'Inter',sans-serif;font-size:max(16px,.95rem);line-height:1.6;opacity:.7;margin-top:.3rem;}
.card-arrow{font-family:'Fraunces',serif;font-weight:900;font-size:max(20px,1.2rem);color:var(--lime);margin-top:.8rem;}
.footer{padding:3rem clamp(2rem,7vw,9rem);border-top:1px solid rgba(216,255,79,.12);font-size:max(14px,.82rem);opacity:.4;}
@media(max-width:600px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header class="header">
  <div class="header-top">
    <div>
      <div class="logo">VAL<span class="li">LEY</span></div>
      <div class="tag">Wood &middot; Season &middot; Soul</div>
    </div>
    <span class="lbl">All Issues</span>
  </div>
</header>
<main class="grid" id="issues-grid">
  <!-- Issues are listed below. New issues are prepended automatically. -->
  <a class="card" href="2026-04-21.html">
    <span class="card-season">Spring 2026</span>
    <span class="card-title">Vol. I, No. 1</span>
    <span class="card-date">21 April 2026</span>
    <span class="card-desc">Build a sleeper planter &middot; What to grow &middot; Frome&rsquo;s quiet revolution &middot; The living material &middot; Valley by the numbers</span>
    <span class="card-arrow">&rarr; Read Issue</span>
  </a>
</main>
<footer class="footer">Valley Magazine &nbsp;&middot;&nbsp; Frome, Somerset &nbsp;&middot;&nbsp; Free, always &nbsp;&middot;&nbsp; Published on GitHub Pages</footer>
</body>
</html>
