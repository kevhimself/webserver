name: Home energy page — update and publish

# Personal / Open Commons project (not Valley).
# Home Assistant sends a "home-energy-push" event with a summary every few hours.
# This merges it into home-energy/data/home.json, commits it, and asks GitHub Pages
# to rebuild, so the public page at kevhimself.github.io/webserver/home-energy/ updates.

on:
  repository_dispatch:
    types: [home-energy-push]
  workflow_dispatch:

concurrency:
  group: home-energy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout webserver repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Merge the Home Assistant summary
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD" > /tmp/payload.json
          python3 scripts/update_home_energy.py /tmp/payload.json

      - name: Commit the new data
        if: github.event_name == 'repository_dispatch'
        run: |
          git config user.name  "Home Energy Bot"
          git config user.email "noreply@github.com"
          git add home-energy/data/home.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Home energy data update"
            git pull --rebase origin main
            git push origin main
          fi

      # Pushes made by this workflow's own token don't start a Pages build by
      # themselves, so ask for one explicitly.
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed (Pages may not be enabled)."
