name: Valley Magazine — Daily Generation

on:
  schedule:
    - cron: '0 7 * * *'   # 7am UTC every day
  workflow_dispatch:       # manual trigger from Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout webserver repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate issue (if month has changed)
        run: python3 generate_magazine.py
        env:
          CI: 'true'

      - name: Commit to webserver repo if a new issue was written
        id: commit
        run: |
          git config user.name  "Valley Magazine Bot"
          git config user.email "noreply@github.com"
          git add magazines/
          if git diff --cached --quiet; then
            echo "No new issue this run — already up to date."
            echo "new_issue=false" >> $GITHUB_OUTPUT
          else
            DATE=$(date +%Y-%m-%d)
            git commit -m "$(printf 'Auto-publish %s Valley Magazine issue\n\nCo-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>' "$DATE")"
            git push origin main
            echo "new_issue=true" >> $GITHUB_OUTPUT
          fi

      # ── Deploy to Cloudflare via valley-sawmills/valley-apps ──────────────
      # Requires VALLEY_APPS_TOKEN secret (GitHub PAT, write access to valley-apps).
      # Steps below are skipped gracefully if the secret is not set.
      # Once kevhimself/webserver is transferred to valley-sawmills, switch to
      # GITHUB_TOKEN and remove the token: line.

      - name: Checkout valley-apps (external customer node)
        if: >
          (steps.commit.outputs.new_issue == 'true' || github.event_name == 'workflow_dispatch')
          && secrets.VALLEY_APPS_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: valley-sawmills/valley-apps
          token: ${{ secrets.VALLEY_APPS_TOKEN }}
          path: valley-apps
          ref: main

      - name: Sync magazine files and wrangler config to valley-apps
        if: >
          (steps.commit.outputs.new_issue == 'true' || github.event_name == 'workflow_dispatch')
          && secrets.VALLEY_APPS_TOKEN != ''
        run: |
          mkdir -p valley-apps/external/public/magazine
          cp magazines/*.html valley-apps/external/public/magazine/
          if [ ! -f valley-apps/external/wrangler.toml ]; then
            printf 'name = "valley-external"\ncompatibility_date = "2024-01-01"\n\n[assets]\ndirectory = "./public"\n' > valley-apps/external/wrangler.toml
          fi

      - name: Commit and push to valley-apps (triggers Cloudflare deploy)
        if: >
          (steps.commit.outputs.new_issue == 'true' || github.event_name == 'workflow_dispatch')
          && secrets.VALLEY_APPS_TOKEN != ''
        run: |
          cd valley-apps
          git config user.name  "Valley Magazine Bot"
          git config user.email "noreply@github.com"
          DATE=$(date +%Y-%m-%d)
          git add external/
          if git diff --cached --quiet; then
            echo "Already in sync — nothing to push."
          else
            git commit -m "$(printf 'Valley Magazine — sync %s issue to external\n\nCo-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>' "$DATE")"
            git push origin main
          fi
